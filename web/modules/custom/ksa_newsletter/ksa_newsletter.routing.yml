ksa_newsletter.entry:
  path: '/nieuwsbrief/insturen'
  defaults:
    _controller: '\Drupal\ksa_newsletter\Controller\NewsletterController::entry'
    _title: 'Bijdrage voor de nieuwsbrief'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
ksa_newsletter.overview:
  path: '/admin/content/nieuwsbrief'
  defaults:
    _controller: '\Drupal\ksa_newsletter\Controller\NewsletterController::overview'
    _title: 'Nieuwsbriefartikelen'
  requirements:
    _permission: 'administer newsletter articles'
  options:
    _admin_route: TRUE
ksa_newsletter.settings:
  path: '/admin/content/nieuwsbrief/instuurlink'
  defaults:
    _form: '\Drupal\ksa_newsletter\Form\LinkForm'
    _title: 'Instuurlink beheren'
  requirements:
    _permission: 'administer newsletter articles'
  options:
    _admin_route: TRUE
    no_cache: TRUE
entity.newsletter_article.canonical:
  path: '/admin/content/nieuwsbrief/{newsletter_article}'
  defaults:
    _controller: '\Drupal\ksa_newsletter\Controller\NewsletterController::detail'
    _title: 'Nieuwsbriefartikel'
  requirements:
    _entity_access: 'newsletter_article.view'
  options:
    _admin_route: TRUE
    parameters:
      newsletter_article:
        type: entity:newsletter_article
ksa_newsletter.api_articles:
  path: '/api/nieuwsbrief/artikelen'
  defaults:
    _controller: '\Drupal\ksa_newsletter\Controller\ApiController::articles'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
ksa_newsletter.api_photo:
  path: '/api/nieuwsbrief/artikelen/{article_uuid}/fotos/{media_uuid}'
  defaults:
    _controller: '\Drupal\ksa_newsletter\Controller\ApiController::photo'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    article_uuid: '[a-f0-9-]{36}'
    media_uuid: '[a-f0-9-]{36}'
  options:
    no_cache: TRUE
ksa_newsletter.api_settings:
  path: '/admin/content/nieuwsbrief/api'
  defaults:
    _form: '\Drupal\ksa_newsletter\Form\ApiKeyForm'
    _title: 'Nieuwsbrief-API'
  requirements:
    _permission: 'administer newsletter articles'
  options:
    _admin_route: TRUE
    no_cache: TRUE
ksa_newsletter.publish_photos:
  path: '/admin/content/nieuwsbrief/{newsletter_article}/fotos-publiceren'
  defaults:
    _form: '\Drupal\ksa_newsletter\Form\PublishPhotosForm'
    _title: 'Nieuwsbrieffoto’s publiceren'
  requirements:
    _permission: 'administer newsletter articles'
  options:
    _admin_route: TRUE
    no_cache: TRUE
    parameters:
      newsletter_article:
        type: entity:newsletter_article
