name: Tekst met beeld
description: 'Titel, tekst en knop met een beeld. Groot en Compact: banner over een beeld (Ons verhaal, Verhuur). Stap en Tab: tekst naast een foto; opeenvolgende stappen worden een stappenbalk, opeenvolgende tabs een tabblad (Inschrijving). Zonder JavaScript staat alles onder elkaar.'
status: stable
props:
  type: object
  properties:
    variant:
      title: Stijl
      type: string
      enum: ['', large, compact, step, tab]
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
slots:
  image:
    title: Beeld
  heading:
    title: Titel
  text:
    title: Tekst
  action:
    title: Knop (link)
  note:
    title: Kleine tekst onder de knop
